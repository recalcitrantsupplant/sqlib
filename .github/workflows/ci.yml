# Thin dispatcher: every step just calls a script in scripts/ci/.
# All real logic lives there so it is runnable locally (`bash scripts/ci/all.sh`)
# and debuggable without GitHub Actions or `act`.
#
# Runs on a self-hosted Linux runner, because hosted runners are not available
# to this account at the moment. A single self-hosted box changes two things
# that the rest of this file depends on:
#   * No `cache: pnpm` on setup-node. That option does not cache to the machine
#     — it round-trips the pnpm store as a ~170MB tarball through GitHub's cache
#     service. On a blank VM that beats re-fetching every package from npm; here
#     the store is already on disk and persists between runs, so the round-trip
#     is pure overhead. scripts/ci/pnpm-store.sh does the part that actually
#     matters: it points PNPM_HOME at a store outliving pnpm/action-setup's
#     ~/setup-pnpm, which is recreated (and so refetched from npm) every job.
#   * One runner means one job at a time. Jobs queue rather than fan out, so the
#     useful lever is fewer, fatter jobs — hence the unsharded `test` below.
#
# Worth knowing: a self-hosted runner executes PR code on a personal machine.
# That is fine while this repo is private and takes no fork PRs, and stops being
# fine the day either changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # enables the manual e2e job

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required gate: lint + build (build also typechecks). Green day one.
  verify:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci/pnpm-store.sh
      - run: bash scripts/ci/install.sh
      - run: bash scripts/ci/lint.sh
      # Checks that the two gates below still fail when they measure nothing,
      # before trusting the numbers they report. ~1s, no install needed.
      - run: bash scripts/ci/ratchet-selftest.sh
      - run: bash scripts/ci/any-ratchet.sh
      - run: bash scripts/ci/orphan-ratchet.sh
      - run: bash scripts/ci/typecheck.sh
      - run: bash scripts/ci/build.sh
      # After build: it checks the built entry points of the packages that are
      # not `private: true` (issue #258). Nothing is published here.
      - run: bash scripts/ci/publish-check.sh
      - if: github.event_name == 'pull_request'
        run: bash scripts/ci/commitlint.sh

  # Unit tests, all packages, affected-aware. Green — safe to require as a gate.
  #
  # Unsharded. The four-way shard matrix only pays off on runners that genuinely
  # run at once; on a single box the shards queue instead, and pay four installs
  # to do it. One job does all of that work — scripts/ci/test.sh runs everything
  # when SHARD is unset.
  #
  # If a second runner is ever registered, restore the matrix — the script still
  # honours SHARD=n/N.
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci/pnpm-store.sh
      - run: bash scripts/ci/install.sh
      - run: bash scripts/ci/test.sh

  # Build the release image without pushing. The node 24 -> 26 bump (e9b49db)
  # merged itself green and broke every publish afterwards, because nothing in
  # the PR pipeline built the image — `verify` and `test` never touch the
  # Dockerfile. This is the gate that would have caught it.
  image:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/docker-build-push.sh # PUSH unset: build only

  # Auto-merge green Dependabot patch/minor bumps. `needs` is the real gate:
  # this repo is private on the free plan, so branch protection / required
  # checks are unavailable and nothing else stops a red PR from being merged.
  dependabot-automerge:
    needs: [verify, test, image]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64]
    # Dependabot-triggered runs get a read-only token by default; these two
    # scopes are what let the merge (and branch delete) go through.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dependabot/fetch-metadata@v3
        id: metadata
      - run: bash scripts/ci/dependabot-automerge.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}

  # Playwright e2e — functional specs, mocked API, production preview build.
  # Visual regression is excluded (font rendering differs per machine); see
  # scripts/ci/e2e.sh for the reasoning. Also runs packages/api's demo-page
  # suite (issue #261), which needs no preview build of its own but does need
  # the topological build below for packages/runtime's built bundle.
  e2e:
    runs-on: [self-hosted, Linux, X64]
    # ETL ships off by default (issue #132). The specs cover the ETL section, and
    # with ssr:false the flags are baked into the client bundle at build time, so
    # they have to be set for build.sh as well as e2e.sh — hence job scope.
    env:
      FEATURE_ETL: 'true'
      FEATURE_PLAYGROUND_ETL: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci/pnpm-store.sh
      - run: bash scripts/ci/install.sh
      # Playwright serves the built app, and the web build needs contracts/types
      # compiled to dist/ first — hence the full topological build.
      - run: bash scripts/ci/build.sh
      - run: bash scripts/ci/e2e.sh
