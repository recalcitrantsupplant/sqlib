# Publish the server image (api + mcp-server) to GHCR.
# Thin: log in with the built-in GITHUB_TOKEN, then call the shell script.
# A new GHCR package inherits the repository's visibility settings; check them
# in the package settings after the first publish.
#
# How images get tagged:
#   - push to main                          -> sha-<short> + latest
#   - push a vX.Y.Z tag (CLI release)       -> X.Y.Z
#     (`git tag v0.1.0 && git push origin v0.1.0`)
#   - "Run workflow" with a version (manual) -> X.Y.Z + a git tag + a GitHub Release
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version e.g. 0.1.0 (leave blank for a sha/latest build only)"
        required: false
        type: string

permissions:
  contents: write # create the git tag + GitHub Release on a manual versioned release
  packages: write # lets GITHUB_TOKEN push to GHCR — no secrets needed

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

# Runs on the self-hosted runner, same as ci.yml and for the same reason (see
# the header there). The push path needs a working docker daemon on the box —
# ci.yml's `image` job builds on the same runner, so a green CI is evidence this
# can publish.
jobs:
  image:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      # docker-container driver: the default `docker` driver cannot export
      # straight to a registry, which is what the push path relies on.
      #
      # `name` + `cleanup: false` + `keep-state: true` are what make this job
      # affordable. By default the action creates a builder called
      # `builder-<random uuid>` and runs `docker buildx rm` on it in post-job
      # cleanup, taking the BuildKit state volume with it — which makes every
      # publish a 100% cold build: zero CACHED steps, the node base image pulled
      # from Docker Hub again, and both `pnpm install`s re-downloading every
      # package from npm. Cost is then whatever the network feels like that
      # minute (observed range 82s to 750s for byte-identical work). Naming the
      # builder and leaving it in place keeps that state on the box between
      # runs, the same way ci.yml's `image` job gets it for free by using the
      # daemon's own builder.
      - uses: docker/setup-buildx-action@v4
        with:
          name: sqlib-publisher
          keep-state: true
          cleanup: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci/docker-build-push.sh
        env:
          PUSH: "true"
          RELEASE_VERSION: ${{ inputs.version }}
      # Manual versioned release: record it as a git tag + GitHub Release.
      # Created via GITHUB_TOKEN, so it does not re-trigger this workflow.
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
