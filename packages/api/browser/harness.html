<!doctype html>
<meta charset="utf-8">
<title>sqlib API worker harness</title>
<script type="module">
  const worker = new Worker('./sqlib-api-worker.js', { type: 'module', name: new URLSearchParams(location.search).get('name') ?? 'sqlib-api' });
  let next = 1;
  const pending = new Map();
  let readyResolve, readyReject;
  window.sqlibReady = new Promise((a, b) => { readyResolve = a; readyReject = b; });
  worker.onmessage = e => {
    const m = e.data;
    if (m.type === 'ready') readyResolve(m);
    else if (m.type === 'failed') readyReject(new Error(m.message));
    else if (m.type === 'response') { pending.get(m.id)?.(m); pending.delete(m.id); }
  };
  worker.onerror = e => readyReject(new Error(e.message));
  const params = new URLSearchParams(location.search);
  worker.postMessage({ type: 'init', libraryUrl: new URL('./library.sqlite', location.href).href, sqliteWasmUrl: new URL('./sqlite3.wasm', location.href).href, duckdbBaseUrl: params.get('duckdb') ?? undefined, persist: params.get('persist') !== 'false', reset: params.has('reset') });
  window.sqlibCall = (method, url, body, headers = {}) => new Promise(resolve => {
    const id = next++;
    const t0 = performance.now();
    pending.set(id, m => resolve({ status: m.status, headers: m.headers, text: new TextDecoder().decode(m.body), ms: performance.now() - t0 }));
    worker.postMessage({ type: 'request', id, method, url, headers: body ? { 'content-type': 'application/json', ...headers } : headers, body: body ? JSON.stringify(body) : null });
  });
</script>
